# Builds the Stash installers and publishes them as a GitHub Release.
#
#   Push a tag like v1.6.0  -> builds, then creates the v1.6.0 release with the
#                              installers attached.
#   Run it by hand          -> builds only; the installers are attached to the
#                              workflow run as a downloadable artifact. Use this
#                              to try a build before releasing it.
#
# The tag must match <Version> in src/Stash/Stash.csproj. Windows Installer
# upgrades by version, so publishing two different builds as the same version
# leaves people unable to tell which one they have.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload its assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Majors that run on Node 24. The v4 releases targeted Node 20, which
      # GitHub has deprecated and was forcing onto Node 24 with a warning.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Pinned to WiX 5: versions 6 and later require accepting the Open Source
      # Maintenance Fee licence. See build.ps1.
      - name: Install WiX 5
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "WiX install failed." }

          # Full path: the global tools folder is not on PATH until the next step.
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          & $wix extension add --global WixToolset.UI.wixext/5.0.2
          & $wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "WiX extensions could not be added." }

      - name: Read the version
        id: version
        shell: powershell
        run: |
          $csproj = [xml](Get-Content src\Stash\Stash.csproj)
          $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ }) -as [string]
          if (-not $version) { throw "No <Version> in Stash.csproj." }

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match the project version $version. Tag v$version, or update <Version> first."
          }

          "value=$version" >> $env:GITHUB_OUTPUT

      # A published release is never overwritten. Checked before building, so
      # re-pushing an existing tag stops at once with a reason, instead of
      # building for several minutes and then failing on "already exists".
      # A manual run only builds, so there it is a warning.
      - name: Check the version is not already released
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.value }}'

          # The runner sets 'stop', and Windows PowerShell then turns the
          # "release not found" stderr of a new version into a terminating error.
          $ErrorActionPreference = 'Continue'
          # "$_" turns each stderr ErrorRecord back into its plain message.
          $out = ((gh release view $tag --json tagName 2>&1 | ForEach-Object { "$_" }) -join ' ').Trim()
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'

          if ($code -eq 0) {
            $msg = "$tag is already published, and a published release is never overwritten. To release again, bump <Version> in src/Stash/Stash.csproj, merge it, and tag the new version."
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              "::error title=Already released::$msg"
              exit 1
            }
            "::warning title=Already released::$msg This manual run only builds, so it carries on."
          }
          elseif ($out -notmatch 'not found') {
            # Could not tell. The publish step still refuses to overwrite.
            "::warning title=Release check skipped::Could not check whether $tag exists: $out"
          }
          exit 0

      # Two installers. build.ps1 empties dist\ on every run, so each one is
      # moved out before the next build.
      #   Stash-<v>-setup.msi                  bundles .NET; runs on any Windows PC
      #   Stash-<v>-framework-dependent.msi    small; needs the .NET 10 Desktop Runtime
      - name: Build installers
        shell: powershell
        run: |
          $v = '${{ steps.version.outputs.value }}'
          New-Item -ItemType Directory release | Out-Null

          .\build.ps1 -Installer -SelfContained -Manufacturer '${{ github.repository_owner }}'
          Move-Item "dist\Stash-$v.msi" "release\Stash-$v-setup.msi"

          .\build.ps1 -Installer -Manufacturer '${{ github.repository_owner }}'
          Move-Item "dist\Stash-$v.msi" "release\Stash-$v-framework-dependent.msi"

          # Text files are written through .NET with LF endings and no BOM.
          # Set-Content in Windows PowerShell writes CRLF, which makes
          # `sha256sum -c` on Linux and macOS reject every line, and its utf8
          # encoding prepends a BOM that ends up at the start of the release notes.
          $utf8 = New-Object System.Text.UTF8Encoding $false

          $sums = Get-FileHash release\*.msi -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          [IO.File]::WriteAllText("$PWD\release\SHA256SUMS.txt", (($sums -join "`n") + "`n"), $utf8)

          # Written here rather than in the publish step, so a manual run
          # produces the notes as well and they can be checked before a release.
          New-Item -ItemType Directory notes | Out-Null
          $notes = @"
          ## Install

          Download **Stash-$v-setup.msi** and double-click it. It installs for your
          Windows account only and does not need administrator rights. Installing a
          newer version upgrades the old one in place and keeps your clips.

          If you already have the .NET 10 Desktop Runtime, the much smaller
          **Stash-$v-framework-dependent.msi** does the same job.

          The installer is not code-signed, so Windows SmartScreen may say it
          "protected your PC". Choose **More info**, then **Run anyway**.
          SHA256SUMS.txt lists the checksums of both files.
          "@
          [IO.File]::WriteAllText("$PWD\notes\release-notes.md", (($notes -replace "`r`n", "`n") + "`n"), $utf8)

          Get-ChildItem release, notes | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: Stash-${{ steps.version.outputs.value }}
          path: |
            release/*
            notes/*
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.value }}'

          # A file, not --notes: Windows PowerShell does not escape the embedded
          # quotes when passing an argument to a native program.
          $assets = Get-ChildItem release | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @assets --title "Stash $v" --notes-file notes\release-notes.md --generate-notes
